name: HomelyBites

options:
  bundleIdPrefix: com.rodisteph
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

# ─── Dépendances Swift Package Manager ──────────────────────────────────────
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.0.0"
  Stripe:
    url: https://github.com/stripe/stripe-ios
    from: "23.0.0"

# ─── Target principal ────────────────────────────────────────────────────────
targets:
  HomelyBites:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # Sources organisées en groupes — miroir de la structure des dossiers
    sources:
      - path: HomelyBites/HomelyBitesApp.swift
      - path: HomelyBites/Core
        name: Core
      - path: HomelyBites/Features
        name: Features
      - path: HomelyBites/Shared
        name: Shared

    # Dépendances Firebase + Stripe
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Stripe
        product: StripeCore
      - package: Stripe
        product: StripePayments
      - package: Stripe
        product: StripePaymentSheet

    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.rodisteph.HomelyBites
        DEVELOPMENT_TEAM: ""                  # À remplir dans Xcode → Signing
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Deep link pour Stripe
        INFOPLIST_KEY_LSApplicationQueriesSchemes: homelybites
        # Clé Stripe (à remplacer par ta vraie clé publishable)
        INFOPLIST_KEY_STRIPE_PUBLISHABLE_KEY: "pk_test_REPLACE_ME"
